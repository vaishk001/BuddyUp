<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chat logo">
  <defs>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9b5cf6" />
      <stop offset="1" stop-color="#ff5ca8" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Rounded gradient background -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="url(#grad)" filter="url(#soft)" />

  <!-- White chat bubble outline -->
  <g transform="translate(8,8) scale(0.85)">
    <path d="M64 18c-20 0-36 11-36 28 0 7 3 13 8 18-1 4-4 12-4 12s10-4 15-7c5 2 11 3 17 3 20 0 36-11 36-28S84 18 64 18z"
          fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
    <!-- tail -->
    <path d="M42 58c3 1 8 4 12 5" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  </g>

</svg>
